server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ {
        proxy_buffering off;
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /docs { return 307 /api/docs; }
    location = /redoc { return 307 /api/redoc; }
    location = /openapi.json { return 307 /api/openapi.json; }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}

